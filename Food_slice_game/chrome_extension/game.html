<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Food Slice!</title>
  <link rel="icon" href="icons/icon32.png">
  <link rel="stylesheet" href="game.css">
</head>
<body>
  <div id="stage">
    <canvas id="game" width="1280" height="720"></canvas>

    <div id="overlay" class="show">
      <div class="card">
        <h1 class="rainbow">Food Slice!</h1>
        <p id="status">Getting the game ready…</p>
        <div id="spinner" class="spinner"></div>
        <div class="buttons">
          <button id="retry" class="pill hidden">Try again</button>
          <button id="mouse" class="pill alt hidden">Play with mouse</button>
        </div>
        <p id="hint" class="small hidden"></p>
      </div>
    </div>

    <div id="corner">
      <button id="fullscreen" class="mini" title="Full screen (F)">⛶</button>
    </div>
  </div>

  <video id="cam" playsinline muted></video>
  <script type="module" src="js/main.js"></script>
</body>
</html>
